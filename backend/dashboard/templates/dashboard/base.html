{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DeepPredict{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'dashboard:summary' %}">DeepPredict</a>
  {% if user.is_authenticated %}
  <nav class="nav">
    <a href="{% url 'dashboard:summary' %}" class="{% if active == 'summary' %}active{% endif %}">Summary</a>
    <a href="{% url 'dashboard:resources' %}" class="{% if active == 'resources' %}active{% endif %}">Drives</a>
    <a href="{% url 'dashboard:models' %}" class="{% if active == 'models' %}active{% endif %}">Models</a>
  </nav>
  <form class="logout" method="post" action="{% url 'dashboard:logout' %}">
    {% csrf_token %}
    <span class="who">{{ user.username }} &middot; {{ user.get_role_display }}</span>
    <button type="submit">Log out</button>
  </form>
  {% endif %}
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
