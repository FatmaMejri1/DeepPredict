# ---------------------------------------------------------------------------
# DeepPredict — SonarQube Project Configuration
# Static Code Analysis, Code Quality, and Testing Evaluation (ISO/IEC 25010)
# ---------------------------------------------------------------------------

# Project Identification
sonar.projectKey=DeepPredict
sonar.projectName=DeepPredict – Predictive Monitoring of IT Infrastructures
sonar.projectVersion=1.0.0

# Source Code Directories (Backend Django, AI Service FastAPI, Frontend)
sonar.sources=backend,ai-service

# Source File Encoding
sonar.sourceEncoding=UTF-8

# Test Code Paths
sonar.tests=backend/accounts/tests.py,backend/accounts/test_permissions.py,backend/audit/tests.py,backend/dashboard/tests.py,backend/dashboard/tests_e2e.py,backend/predictions/tests.py,backend/predictions/test_inference_client.py,ai-service/tests

# Inclusions (Application source files)
sonar.inclusions=backend/**/*.py,backend/dashboard/templates/**/*.html,backend/dashboard/static/**/*.css,backend/dashboard/static/**/*.js,ai-service/dp_ml/**/*.py,ai-service/service/**/*.py

# Exclusions (Generated files, virtual environments, build artifacts, evidence)
sonar.exclusions=**/venv/**,**/.venv/**,**/.venv312/**,**/__pycache__/**,**/migrations/**,**/evidence/**,**/htmlcov*/**,backend/dashboard_backup/**,**/*.sqlite3,**/*.log,**/*.pid,ai-service/notebooks/**,ai-service/data/**,ai-service/models/**,backend/locustfile.py

# Test File Pattern
sonar.test.inclusions=**/*test*.py

# Python Test Coverage Reports (Cobertura XML format)
sonar.python.coverage.reportPaths=backend/coverage.xml,ai-service/evidence/testing/coverage.xml

# Python Test Execution Reports (XUnit XML format)
sonar.python.xunit.reportPath=ai-service/evidence/testing/test-results.xml
